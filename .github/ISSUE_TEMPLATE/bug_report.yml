name: Bug report
description: Face or eye tracking is missing, wrong or the module won't load.
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Module version
      description: The version in the release zip you installed.
    validations:
      required: true

  - type: input
    id: streamer
    attributes:
      label: Virtual Desktop Streamer version
    validations:
      required: true

  - type: input
    id: headset
    attributes:
      label: Headset
      placeholder: "Quest Pro"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: VRCFaceTracking log
      description: The lines around the problem. Remove anything you don't want public.
      render: text
    validations:
      required: false
